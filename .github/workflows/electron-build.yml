name: App build
run-name: App Build For ${{ inputs.project }}
on:
  workflow_call:
    inputs:
      os-version:
        type: string
        default: windows-latest
      project:
        type: string
        default: watertap
      pip-install-target:
        type: string
        default: watertap@git+https://github.com/watertap-org/watertap@main
      artifact-name:
        type: string
        default: ${{ inputs.project }}-Flowsheet-Processor
      idaes-flowsheet-processor-ui-repo:
        type: string
        default: prommis/idaes-flowsheet-processor-ui
      idaes-flowsheet-processor-ui-ref:
        type: string
        default: main
      package-build-number:
        type: string
      project-version:
        type: string
      sign-distribution:
        type: boolean
        default: true
      gcp-code-signing-project-id:
        type: string
        default: ''
      gcp-code-signing-workload-identity-provider:
        type: string
        default: ''
      gcp-code-signing-service-account:
        type: string
        default: ''
      gcp-code-signing-kms-key-version:
        type: string
        default: ''
      google-kms-cng-version:
        type: string
        default: '1.4'
      windows-signing-timestamp-url:
        type: string
        default: 'http://timestamp.digicert.com'
      python-version:
        type: number
        default: 3.13
    secrets:
      GCP_CODE_SIGNING_PROJECT_ID:
        required: false
      GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER:
        required: false
      GCP_CODE_SIGNING_SERVICE_ACCOUNT:
        required: false
      GCP_CODE_SIGNING_KMS_KEY_VERSION:
        required: false
      GCP_CODE_SIGNING_CERTIFICATE_BASE64:
        required: false
      GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64:
        required: false
      GCP_CODE_SIGNING_INTERMEDIATE_2_BASE64:
        required: false
      APPLE_BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      TEAM_ID:
        required: false

defaults:
  run:
    # -l: use login shell (required when using Conda)
    shell: bash -l {0}

jobs:
  electron-build:
    name: ${{ inputs.os-version }}/Python${{ inputs.python-version }}
    runs-on: ${{ inputs.os-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows signing configuration
        id: windows-signing
        if: runner.os == 'Windows' && inputs.sign-distribution
        shell: pwsh
        env:
          GCP_PROJECT_ID: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
          LEAF_BASE64: ${{ secrets.GCP_CODE_SIGNING_CERTIFICATE_BASE64 }}
          INTERMEDIATE_1_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          $requiredVariables = [ordered]@{
            'gcp-code-signing-project-id' = $env:GCP_PROJECT_ID
            'gcp-code-signing-workload-identity-provider' = $env:GCP_WORKLOAD_IDENTITY_PROVIDER
            'gcp-code-signing-service-account' = $env:GCP_SERVICE_ACCOUNT
            'gcp-code-signing-kms-key-version' = $env:GCP_KMS_KEY_VERSION
          }

          $requiredSecrets = [ordered]@{
            'GCP_CODE_SIGNING_CERTIFICATE_BASE64' = $env:LEAF_BASE64
            'GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64' = $env:INTERMEDIATE_1_BASE64
          }

          $missingVariables = @()
          foreach ($item in $requiredVariables.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missingVariables += $item.Key
            }
          }

          if ($missingVariables.Count -eq $requiredVariables.Count) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=false'
            Write-Host 'Windows signing skipped because no Google Cloud code signing repository variables are available.'
            exit 0
          }

          if ($missingVariables.Count -gt 0) {
            throw "Windows signing configuration is incomplete. Missing repository variables: $($missingVariables -join ', ')"
          }

          $missingSecrets = @()
          foreach ($item in $requiredSecrets.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              $missingSecrets += $item.Key
            }
          }

          if ($missingSecrets.Count -gt 0) {
            throw "Windows signing configuration is incomplete. Missing repository or environment secrets: $($missingSecrets -join ', ')"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=true'

      - name: Preflight Google Cloud authentication
        id: google-auth-preflight
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          workload_identity_provider: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Preflight Google Cloud KMS access
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth-preflight.outputs.access_token }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_ACCESS_TOKEN)) {
            throw 'Google Cloud authentication preflight did not return an access token.'
          }

          $headers = @{
            Authorization = "Bearer $env:GOOGLE_ACCESS_TOKEN"
          }
          $publicKeyUri = "https://cloudkms.googleapis.com/v1/$env:GCP_KMS_KEY_VERSION/publicKey"

          Invoke-RestMethod -Method Get -Uri $publicKeyUri -Headers $headers | Out-Null

      - name: Decode code-signing certificates
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          LEAF_BASE64: ${{ secrets.GCP_CODE_SIGNING_CERTIFICATE_BASE64 }}
          INTERMEDIATE_1_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_1_BASE64 }}
          INTERMEDIATE_2_BASE64: ${{ secrets.GCP_CODE_SIGNING_INTERMEDIATE_2_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Write-Certificate {
            param(
              [Parameter(Mandatory = $true)][string]$Base64Value,
              [Parameter(Mandatory = $true)][string]$Path
            )

            $normalized = $Base64Value -replace '\s', ''
            [IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($normalized))
          }

          $leaf = Join-Path $env:RUNNER_TEMP 'code-signing.cer'
          $intermediate1 = Join-Path $env:RUNNER_TEMP 'intermediate1.cer'

          Write-Certificate -Base64Value $env:LEAF_BASE64 -Path $leaf
          Write-Certificate -Base64Value $env:INTERMEDIATE_1_BASE64 -Path $intermediate1

          Add-Content -Path $env:GITHUB_ENV -Value "GCP_SIGNING_CERTIFICATE=$leaf"
          Add-Content -Path $env:GITHUB_ENV -Value "GCP_SIGNING_INTERMEDIATE_1=$intermediate1"

          if (-not [string]::IsNullOrWhiteSpace($env:INTERMEDIATE_2_BASE64)) {
            $intermediate2 = Join-Path $env:RUNNER_TEMP 'intermediate2.cer'
            Write-Certificate -Base64Value $env:INTERMEDIATE_2_BASE64 -Path $intermediate2
            Add-Content -Path $env:GITHUB_ENV -Value "GCP_SIGNING_INTERMEDIATE_2=$intermediate2"
          }

      - name: Install Google Cloud KMS CNG Provider
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CNG_VERSION: ${{ inputs.google-kms-cng-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releaseUrl = "https://api.github.com/repos/GoogleCloudPlatform/kms-integrations/releases/tags/cng-v$env:CNG_VERSION"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers

          $assets = @($release.assets)
          $asset = @($assets | Where-Object { $_.name -match '\.msi$' } | Select-Object -First 1)
          $assetType = 'msi'

          if ($asset.Count -eq 0) {
            $asset = @($assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1)
            $assetType = 'zip'
          }

          if ($asset.Count -ne 1) {
            $assetNames = @($assets | ForEach-Object { $_.name }) -join ', '
            throw "Expected one MSI or windows-amd64 ZIP in CNG release cng-v$env:CNG_VERSION. Release assets: $assetNames"
          }

          $assetPath = Join-Path $env:RUNNER_TEMP $asset[0].name
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $assetPath

          if ($asset[0].digest -match '^sha256:(.+)$') {
            $expectedDigest = $Matches[1].ToLowerInvariant()
            $actualDigest = (Get-FileHash -Algorithm SHA256 -Path $assetPath).Hash.ToLowerInvariant()
            if ($actualDigest -ne $expectedDigest) {
              throw "Downloaded CNG Provider asset digest mismatch. Expected $expectedDigest; got $actualDigest."
            }
          }

          if ($assetType -eq 'zip') {
            $extractPath = Join-Path $env:RUNNER_TEMP 'kmscng'
            Expand-Archive -LiteralPath $assetPath -DestinationPath $extractPath -Force
            $msiFiles = @(Get-ChildItem -Path $extractPath -Recurse -Filter 'kmscng.msi')

            if ($msiFiles.Count -ne 1) {
              throw "Expected one kmscng.msi inside $($asset[0].name); found $($msiFiles.Count)."
            }

            $msiPath = $msiFiles[0].FullName
          } else {
            $msiPath = $assetPath
          }

          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            '/i', $msiPath, '/quiet', '/norestart'
          )

          if ($install.ExitCode -ne 0) {
            throw "CNG Provider installation failed with exit code $($install.ExitCode)."
          }

      - name: Configure Google Cloud KMS CNG Provider
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'

          $configDirectory = 'C:\Windows\KMSCNG'
          New-Item -ItemType Directory -Force -Path $configDirectory | Out-Null

          $config = @(
            '---'
            'resources:'
            "  - crypto_key_version: `"$env:GCP_KMS_KEY_VERSION`""
          )
          Set-Content -Path "$configDirectory\config.yaml" -Value $config -Encoding ascii

      - name: Install certificate intermediates
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $intermediates = @(
            $env:GCP_SIGNING_INTERMEDIATE_1,
            $env:GCP_SIGNING_INTERMEDIATE_2
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          foreach ($certificate in $intermediates) {
            & certutil.exe -user -addstore -f CA $certificate
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install intermediate certificate: $certificate"
            }
          }

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ inputs.python-version }}
          miniforge-version: 25.3.1-0
          activate-environment: ifp-build-env
          channels: conda-forge,nodefaults

      - name: Install conda dependencies
        run: |
          conda install -c conda-forge nodejs=20.9.0 -y
          pip install -r pyinstaller/requirements.txt

      - name: Resolve workflow author
        id: get-author
        run: |
          echo "AUTHOR=${{ github.actor }} <${{ github.event.pusher.email }}>" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ruby-dev build-essential libgfortran5 liblapack3 libgomp1 libblas3
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Install Apple signing certificate
        if: runner.os == 'macOS' && inputs.sign-distribution && env.BUILD_CERTIFICATE_BASE64 != '' && env.P12_PASSWORD != '' && env.KEYCHAIN_PASSWORD != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Resolve package build number
        id: generate-build-number
        run: |
          if [ -z "${{ inputs.package-build-number }}" ]; then
            echo "build-number=$(date +'%y.%m.%d')" >> "$GITHUB_OUTPUT"
          else
            echo "build-number=${{ inputs.package-build-number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve artifact platform values
        id: os-specific-values
        run: |
          if [ "${{ inputs.os-version }}" == "windows-latest" ]; then
            echo "os=win64" >> "$GITHUB_OUTPUT"
            echo "artifact-file-extension=exe" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.os-version }}" == "ubuntu-22.04" ]; then
            echo "os=amd64" >> "$GITHUB_OUTPUT"
            echo "artifact-file-extension=deb" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.os-version }}" == "macos-latest" ]; then
            echo "os=arm64" >> "$GITHUB_OUTPUT"
            echo "artifact-file-extension=dmg" >> "$GITHUB_OUTPUT"
          fi

      - name: Set artifact path
        id: artifact-path
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          BUILD_NUMBER: ${{ steps.generate-build-number.outputs.build-number }}
          ARTIFACT_OS: ${{ steps.os-specific-values.outputs.os }}
          ARTIFACT_EXTENSION: ${{ steps.os-specific-values.outputs.artifact-file-extension }}
        run: |
          artifact_path="electron/dist/${ARTIFACT_NAME}_${BUILD_NUMBER}_${ARTIFACT_OS}.${ARTIFACT_EXTENSION}"
          echo "path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Install IDAES Flowsheet Processor UI locally
        working-directory: ./electron
        env:
          IFP_UI_REPO: ${{ inputs.idaes-flowsheet-processor-ui-repo }}
          IFP_UI_REF: ${{ inputs.idaes-flowsheet-processor-ui-ref }}
        run: |
          git clone "https://github.com/${IFP_UI_REPO}.git"
          cd idaes-flowsheet-processor-ui
          git fetch --all --tags
          git checkout "$IFP_UI_REF"
          pip install --progress-bar off .

      - name: Pip install ${{ inputs.pip-install-target }}
        env:
          PIP_INSTALL_TARGET: ${{ inputs.pip-install-target }}
        run: pip install --progress-bar off "$PIP_INSTALL_TARGET"

      - name: Install jaraco.text
        run: pip install --progress-bar off jaraco.text

      - name: Set configuration files
        env:
          PROJECT: ${{ inputs.project }}
          BUILD_NUMBER: ${{ steps.generate-build-number.outputs.build-number }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          AUTHOR: ${{ steps.get-author.outputs.AUTHOR }}
          PROJECT_VERSION: ${{ inputs.project-version }}
        run: |
          cmd=(
            python scripts/set_configuration.py
            -p "$PROJECT"
            -bv "$BUILD_NUMBER"
            -a "$ARTIFACT_NAME"
            -au "$AUTHOR"
          )

          if [ -n "$PROJECT_VERSION" ]; then
            cmd+=(-pv "$PROJECT_VERSION")
          fi

          "${cmd[@]}"

      - name: Install Electron dependencies
        working-directory: ./electron
        run: npm install

      - name: Install frontend dependencies
        working-directory: ./electron/idaes-flowsheet-processor-ui/frontend
        run: npm clean-install

      - name: Get idaes extensions
        run: idaes get-extensions

      - name: Transfer entry points
        working-directory: ./scripts
        env:
          PROJECT: ${{ inputs.project }}
        run: python move_entrypoints.py -p "$PROJECT"

      - name: Build backend
        working-directory: ./pyinstaller
        run: pyinstaller -y --clean --distpath ../electron/py_dist main.spec

      - name: Build frontend
        working-directory: ./electron/idaes-flowsheet-processor-ui/frontend
        env:
          CI: false
        run: npm run build

      - name: Remove ico files before Linux packaging
        if: runner.os == 'Linux'
        working-directory: ./scripts
        run: |
          python remove_icons.py

      - name: Build ${{ steps.os-specific-values.outputs.os }} Distribution
        env:
          SIGN_DISTRIBUTION: ${{ inputs.sign-distribution }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        working-directory: ./electron
        run: |
          if [ "${{ steps.os-specific-values.outputs.os }}" = "arm64" ]; then
            if [ "${SIGN_DISTRIBUTION}" != "true" ]; then
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset APPLE_ID APPLE_ID_PASSWORD TEAM_ID
            fi
            npm run electron-build-mac
          elif [ "${{ steps.os-specific-values.outputs.os }}" = "win64" ]; then
            npm run electron-build-win
          elif [ "${{ steps.os-specific-values.outputs.os }}" = "amd64" ]; then
            npm run electron-build-lin
          fi

      - name: Authenticate to Google Cloud
        if: steps.windows-signing.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ inputs.gcp-code-signing-project-id || secrets.GCP_CODE_SIGNING_PROJECT_ID }}
          workload_identity_provider: ${{ inputs.gcp-code-signing-workload-identity-provider || secrets.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.gcp-code-signing-service-account || secrets.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Sign and verify Windows distribution
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.artifact-path.outputs.path }}
          GCP_KMS_KEY_VERSION: ${{ inputs.gcp-code-signing-kms-key-version || secrets.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
          TIMESTAMP_URL: ${{ inputs.windows-signing-timestamp-url }}
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath $env:ARTIFACT_PATH)) {
            throw "Artifact does not exist: $env:ARTIFACT_PATH"
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signTool) {
            throw 'Could not locate the x64 Windows SDK signtool.exe.'
          }

          & $signTool sign `
            /v `
            /fd SHA256 `
            /tr $env:TIMESTAMP_URL `
            /td SHA256 `
            /f $env:GCP_SIGNING_CERTIFICATE `
            /csp 'Google Cloud KMS Provider' `
            /kc $env:GCP_KMS_KEY_VERSION `
            $env:ARTIFACT_PATH

          if ($LASTEXITCODE -ne 0) {
            throw "SignTool signing failed with exit code $LASTEXITCODE."
          }

          & $signTool verify /pa /all /v /tw $env:ARTIFACT_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool verification failed with exit code $LASTEXITCODE."
          }

      - name: Upload artifact for ${{ steps.os-specific-values.outputs.os }} build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.project }}-${{ steps.os-specific-values.outputs.os }}-${{ inputs.python-version }}-dist
          path: ${{ steps.artifact-path.outputs.path }}
