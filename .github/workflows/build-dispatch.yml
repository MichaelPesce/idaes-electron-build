name: Application Build Dispatch

on:
  workflow_dispatch:
    inputs:
      os-version:
        description: "Operating system version"
        type: choice
        options:
          - windows-latest
          - macos-latest
          - ubuntu-22.04
        default: windows-latest

      project:
        description: "Project name"
        type: choice
        options:
          - watertap
          - prommis
          - idaes
        default: watertap

      idaes-flowsheet-processor-ui-repo:
        description: "IDAES Flowsheet Processor UI repository URL"
        type: string
        default: prommis/idaes-flowsheet-processor-ui

      idaes-flowsheet-processor-ui-ref:
        description: "Branch or tag for the IDAES Flowsheet Processor UI repository"
        type: string
        default: main

      pip-install-target:
        description: "Pip target for python project (leave empty to auto-generate based on project)"
        type: string
        default: ""

      artifact-name:
        description: "Build artifact name (leave empty to auto-generate based on project)"
        type: string
        default: ""

      package-build-number:
        description: "Package build number (eg. 26.06.08)"
        type: string

      project-version:
        description: "Python project version (eg. 1.5.0)"
        type: string

      sign-distribution:
        description: "If true, sign the installer when signing credentials are available."
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build-inputs.outputs.artifact-name }}
      pip-install-target: ${{ steps.build-inputs.outputs.pip-install-target }}
    steps:
      - name: Resolve build inputs
        id: build-inputs
        env:
          PROJECT: ${{ inputs.project }}
          PIP_INSTALL_TARGET: ${{ inputs.pip-install-target }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          case "$PROJECT" in
            watertap)
              default_target="watertap@git+https://github.com/watertap-org/watertap@main"
              default_artifact="WaterTAP-Flowsheet-Processor"
              ;;
            prommis)
              default_target="prommis@git+https://github.com/prommis/prommis@main"
              default_artifact="PrOMMiS-flowsheet-processor"
              ;;
            idaes)
              default_target="idaes-pse@git+https://github.com/IDAES/idaes-pse@main"
              default_artifact="IDAES-flowsheet-processor"
              ;;
          esac

          echo "pip-install-target=${PIP_INSTALL_TARGET:-$default_target}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${ARTIFACT_NAME:-$default_artifact}" >> "$GITHUB_OUTPUT"

  electron-build:
    needs: prepare
    uses: ./.github/workflows/electron-build.yml
    name: ${{ inputs.project }}
    permissions:
      contents: read
      id-token: write
    with:
      os-version: ${{ inputs.os-version }}
      project: ${{ inputs.project }}
      pip-install-target: ${{ needs.prepare.outputs.pip-install-target }}
      artifact-name: ${{ needs.prepare.outputs.artifact-name }}
      idaes-flowsheet-processor-ui-repo: ${{ inputs.idaes-flowsheet-processor-ui-repo }}
      idaes-flowsheet-processor-ui-ref: ${{ inputs.idaes-flowsheet-processor-ui-ref }}
      package-build-number: ${{ inputs.package-build-number }}
      project-version: ${{ inputs.project-version }}
      sign-distribution: ${{ inputs.sign-distribution }}
      gcp-code-signing-project-id: ${{ vars.GCP_CODE_SIGNING_PROJECT_ID }}
      gcp-code-signing-workload-identity-provider: ${{ vars.GCP_CODE_SIGNING_WORKLOAD_IDENTITY_PROVIDER }}
      gcp-code-signing-service-account: ${{ vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
      gcp-code-signing-kms-key-version: ${{ vars.GCP_CODE_SIGNING_KMS_KEY_VERSION }}
      google-kms-cng-version: ${{ vars.GOOGLE_KMS_CNG_VERSION || '1.4' }}
      windows-signing-timestamp-url: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    secrets: inherit
